capabilities:
  ef.shared.foundation:
    status: ADMITTED
    owner: foundation
    provider: ef-foundation
    contract: contracts/foundation.yaml
  ef.shared.persistence:
    status: ADMITTED
    owner: data
    provider: ef-data
    contract: contracts/data.yaml
  ef.shared.presentation:
    status: ADMITTED
    owner: presentation
    provider: ef-presentation
    contract: contracts/presentation.yaml
  ef.shared.observability:
    status: ADMITTED
    owner: observability
    provider: ef-observability
    contract: contracts/observability.yaml
  ef.shared.operations:
    status: ADMITTED
    owner: operations
    provider: ef-operations
    contract: contracts/operations.yaml
  ef.institutional.conformance:
    status: ADMITTED
    owner: institutional_control
    provider: ef-governance
    contract: contracts/institutional-conformance.yaml
  ef.institutional.release:
    status: ADMITTED
    owner: institutional_control
    provider: ef-governance
    contract: contracts/institutional-release.yaml
platform_capabilities:
  wordpress.hooks:
    owner: WORDPRESS
    availability: FEATURE_DETECT
  wordpress.http:
    owner: WORDPRESS
    availability: FEATURE_DETECT
  wordpress.rest:
    owner: WORDPRESS
    availability: FEATURE_DETECT
  wordpress.abilities:
    owner: WORDPRESS
    availability: FEATURE_DETECT
  wordpress.ai_client:
    owner: WORDPRESS
    availability: FEATURE_DETECT
  wordpress.connectors:
    owner: WORDPRESS
    availability: FEATURE_DETECT
rules:
  consume_only_if:
  - capability_status_is_ADMITTED
  - contract_locator_resolves_and_contract_capability_matches
  - provider_conformance_is_PASS
  - runtime_availability_is_AVAILABLE_or_contract_explicitly_permits_DEGRADED

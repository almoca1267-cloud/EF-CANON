    activation_scope: BOTH
    storage_scope: NOT_APPLICABLE
    capabilities:
    - ef.shared.foundation
  ef-data:
    class: PROVIDER
    implementation_state: ADOPTION_PENDING
    conformance_state: BLOCKED
    runtime_availability: UNKNOWN
    multisite_scope: BOTH
    activation_scope: BOTH
    storage_scope: BOTH
    capabilities:
    - ef.shared.persistence
  ef-presentation:
    class: PROVIDER
    implementation_state: ADOPTION_PENDING
    conformance_state: BLOCKED
    runtime_availability: UNKNOWN
    multisite_scope: BOTH
    activation_scope: BOTH
    storage_scope: NOT_APPLICABLE
    capabilities:
    - ef.shared.presentation
  ef-observability:
    class: PROVIDER
    implementation_state: ADOPTION_PENDING
    conformance_state: BLOCKED
    runtime_availability: UNKNOWN
    multisite_scope: BOTH
    activation_scope: BOTH
    storage_scope: BOTH
    capabilities:
    - ef.shared.observability
  ef-operations:
    class: PROVIDER
    implementation_state: ADOPTION_PENDING
    conformance_state: BLOCKED
    runtime_availability: UNKNOWN
    multisite_scope: BOTH
    activation_scope: BOTH
    storage_scope: BOTH
    capabilities:
    - ef.shared.operations
  ef-governance:
    class: INSTITUTIONAL_CONTROLLER
    implementation_state: ADOPTION_PENDING
